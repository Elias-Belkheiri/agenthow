[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[project]
name = "agent-smith"
version = "0.1.0"
description = "Agent Smith project scaffold"
requires-python = ">=3.10,<3.11"
dependencies = [
    "httpx>=0.27,<1",
    "litellm==1.106.6",
    "openai>=2.20,<3",
    "pydantic>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["src"]
